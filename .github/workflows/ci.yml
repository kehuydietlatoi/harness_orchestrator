name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # Run on Linux and Windows: the subprocess layer (shell quoting, spawn
    # plumbing) is Windows-specific in places, so Windows must actually exercise it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
