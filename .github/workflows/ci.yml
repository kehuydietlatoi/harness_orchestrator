name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # Run on Linux and Windows: the subprocess layer (shell quoting, spawn
    # plumbing) is Windows-specific in places, so Windows must actually exercise it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Test the declared engines floor (20) and current LTS (22).
        node-version: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # --ignore-scripts: the `prepare` build runs explicitly below, after the
      # lint/typecheck gates, so a compile error surfaces there first.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run test:e2e
